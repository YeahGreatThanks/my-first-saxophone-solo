<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miles - Warehouse Manager</title>
<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 48px 40px;
    max-width: 420px;
    width: 90%;
    text-align: center;
  }
  .card h1 {
    margin: 0 0 8px;
    font-size: 28px;
    color: #1a1a2e;
  }
  .card h2 {
    margin: 0 0 24px;
    font-size: 16px;
    font-weight: 500;
    color: #5a6270;
  }
  .card p {
    font-size: 15px;
    color: #3b3f45;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .contact {
    display: inline-block;
    padding: 12px 28px;
    background: #2a5d9f;
    color: #ffffff;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Miles</h1>
    <h2>Warehouse Manager</h2>
    <p>Supporting the Warehouse Team with hands-on coordination, inventory accuracy, and keeping operations running smoothly day to day.</p>
    <div class="contact">Get in touch with Miles</div>
  </div>
</body>
</html>
