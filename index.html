<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miles - Warehouse Manager</title>
<style>
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #FF5F00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .card {
    background-color: #ffffff;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
  }
  .card h1 {
    margin: 0 0 8px 0;
    font-size: 28px;
    color: #1a1a1a;
  }
  .card h2 {
    margin: 0 0 20px 0;
    font-size: 16px;
    font-weight: 500;
    color: #555555;
  }
  .card p {
    margin: 0 0 24px 0;
    font-size: 15px;
    color: #444444;
    line-height: 1.5;
  }
  .card .contact {
    font-size: 14px;
    color: #FF5F00;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Miles</h1>
    <h2>Warehouse Manager</h2>
    <p>Supporting the Warehouse Team with hands-on inventory management and day-to-day operations.</p>
    <p class="contact">Reach out any time to connect.</p>
  </div>
</body>
</html>
